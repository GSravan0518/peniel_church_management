services:
  - type: web
    name: peniel-fellowship
    runtime: node
    plan: free
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: CHURCH_NAME
        value: Peniel Evangelical Fellowship
      - key: VITE_API_URL
        value: /api
      - key: VITE_CHURCH_NAME
        value: Peniel Evangelical Fellowship
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_RESET_PASSWORD
        sync: false
